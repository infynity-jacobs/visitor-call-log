# Nginx site config for the Visitor Register & Call Log application.
#
# This is a TEMPLATE: deploy/install.sh substitutes __SERVER_NAME__ and
# __FRONTEND_DIST__ before copying it to /etc/nginx/sites-available/.
# To edit by hand instead, replace those placeholders yourself:
#   __SERVER_NAME__   -> your domain, or _ to accept any hostname
#   __FRONTEND_DIST__ -> absolute path to the built frontend, e.g.
#                        /opt/visitor-call-log/app/frontend/dist

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    # Serve the built React app.
    root __FRONTEND_DIST__;
    index index.html;

    # Reasonable upload size for report attachments / logo uploads.
    client_max_body_size 10m;

    # Proxy API requests to the Node backend.
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Static assets: long cache, since Vite fingerprints filenames.
    location /assets/ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app fallback: any unmatched path serves index.html so
    # client-side routing (React Router) works on refresh/deep links.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- HTTPS ---
    # After running: sudo certbot --nginx -d __SERVER_NAME__
    # certbot will add the listen 443 ssl block and redirect automatically.
    # See docs/INSTALL.md "HTTPS configuration" for manual setup instead.
}
